VehicleInput:
  type: object
  required:
    - license_plate
    - vehicle_type
  properties:
    license_plate:
      type: string
      example: "59-X1 123.45"
    vehicle_type:
      type: string
      enum: [CAR_4_SEATS, CAR_7_SEATS, BIKE]
      example: "CAR_4_SEATS"
    model:
      type: string
      example: "Toyota Vios"
    color:
      type: string
      example: "Trắng"

Vehicle:
  allOf:
    - type: object
      properties:
        id:
          type: integer
          example: 20
        driver_id:
          type: integer
          example: 50
    - $ref: '#/VehicleInput'
