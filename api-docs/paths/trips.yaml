trips:
  post:
    tags:
      - MOD02/03 - Trip Management
    summary: Tạo yêu cầu Đặt xe mới (Create Trip - FR02.1)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - pickup_address
              - pickup_lat
              - pickup_lng
              - dropoff_address
              - dropoff_lat
              - dropoff_lng
              - vehicle_type
            properties:
              pickup_address:
                type: string
                example: "220 Điện Biên Phủ, Bình Thạnh, TP.HCM"
              pickup_lat:
                type: number
                format: double
                example: 10.796321
              pickup_lng:
                type: number
                format: double
                example: 106.708123
              dropoff_address:
                type: string
                example: "Chợ Bến Thành, Quận 1, TP.HCM"
              dropoff_lat:
                type: number
                format: double
                example: 10.772543
              dropoff_lng:
                type: number
                format: double
                example: 106.698021
              vehicle_type:
                type: string
                enum: [CAR_4_SEATS, CAR_7_SEATS, BIKE]
                example: "CAR_4_SEATS"
    responses:
      '201':
        description: Tạo chuyến đi thành công, trạng thái PENDING
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Trip.yaml'
  get:
    tags:
      - MOD02/03 - Trip Management
    summary: Tra cứu danh sách lịch sử chuyến đi của tôi
    parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 10
      - name: status
        in: query
        schema:
          type: string
          enum: [PENDING, ACCEPTED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED]
    responses:
      '200':
        description: Danh sách lịch sử chuyến đi
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/Trip.yaml'

trip_by_id:
  get:
    tags:
      - MOD02/03 - Trip Management
    summary: Xem chi tiết một chuyến đi
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Chi tiết thông tin chuyến đi
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Trip.yaml'

trip_respond:
  post:
    tags:
      - MOD02/03 - Trip Management
    summary: Tài xế Chấp nhận hoặc Từ chối nhận chuyến
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - action
            properties:
              action:
                type: string
                enum: [ACCEPT, REJECT]
                example: "ACCEPT"
    responses:
      '200':
        description: Xử lý phản hồi thành công

trip_status:
  patch:
    tags:
      - MOD02/03 - Trip Management
    summary: Cập nhật trạng thái tiến trình chuyến đi
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - status
            properties:
              status:
                type: string
                enum: [ARRIVED, IN_PROGRESS, COMPLETED]
                example: "ARRIVED"
    responses:
      '200':
        description: Cập nhật tiến trình chuyến đi thành công

trip_cancel:
  post:
    tags:
      - MOD02/03 - Trip Management
    summary: Hủy chuyến đi
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - reason
            properties:
              reason:
                type: string
                example: "Khách không xuất hiện tại điểm đón"
    responses:
      '200':
        description: Hủy chuyến thành công và áp dụng phí phạt nếu có
