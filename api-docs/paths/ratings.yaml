trip_rate:
  post:
    tags:
      - MOD05 - Ratings & Feedback
    summary: Đánh giá chất lượng chuyến đi
    parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - score
            properties:
              score:
                type: integer
                minimum: 1
                maximum: 5
                example: 5
              comment:
                type: string
                example: "Tài xế lái xe an toàn, phục vụ tốt."
    responses:
      '201':
        description: Gửi đánh giá thành công
        content:
          application/json:
            schema:
              $ref: '../components/schemas/Rating.yaml'

driver_ratings:
  get:
    tags:
      - MOD05 - Ratings & Feedback
    summary: Tra cứu danh sách đánh giá của một Tài xế
    parameters:
      - name: driver_id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '200':
        description: Danh sách các đánh giá
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/schemas/Rating.yaml'

rating_by_id:
  put:
    tags:
      - MOD05 - Ratings & Feedback
    summary: Chỉnh sửa đánh giá
    parameters:
      - name: rating_id
        in: path
        required: true
        schema:
          type: integer
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              score:
                type: integer
                example: 4
              comment:
                type: string
                example: "Xe hơi có mùi."
    responses:
      '200':
        description: Đã cập nhật đánh giá
  delete:
    tags:
      - MOD05 - Ratings & Feedback
    summary: Xóa đánh giá (Admin Only)
    parameters:
      - name: rating_id
        in: path
        required: true
        schema:
          type: integer
    responses:
      '204':
        description: Đã xóa đánh giá thành công
